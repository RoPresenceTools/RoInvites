services:
  server:
    build:
      context: .
    ports:
      - 8000:8000
    depends_on:
      - postgres
    secrets:
      - pg_user
      - pg_pw
      - roblosecurity
      - discord_token

  postgres:
    image: postgres:18.4
    container_name: postgres
    hostname: postgres
    environment:
      POSTGRES_USER_FILE: /run/secrets/pg_user
      POSTGRES_DB: roblox_invites
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_pw
      TZ: America/New_York
      PGTZ: America/New_York
    secrets:
      - pg_user
      - pg_pw
    volumes:
      - ./container/data:/var/lib/postgresql
      - ./container/logs:/var/log/postgresql
    command: >
      postgres -c logging_collector=on
               -c log_directory=/var/log/postgresql
               -c log_filename=postgresql.log
               -c log_statement=all
               -c log_connections=on
               -c log_disconnections=on
               -c log_destination=stderr,csvlog
               -c log_rotation_age=1d
               -c shared_preload_libraries=pg_stat_statements
               -c pg_stat_statements.track=all
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5

secrets:
  pg_user:
    file: ./container/secrets/pg_user.txt
  pg_pw:
    file: ./container/secrets/pg_pw.txt
  discord_token:
    file: ./container/secrets/discord_token.txt
  roblosecurity:
    file: ./container/secrets/roblosecurity.txt